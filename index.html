<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"San Francisco",Arial;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    text-align:center;
}

.page{
    display:none;
    flex-direction:column;
    align-items:center;
    animation: fadeIn 1s ease;
}

.active{ display:flex; }

h1{ color:#ff2e63; }

.heart-big{
    font-size:90px;
    animation: bounce 1s infinite alternate;
}

@keyframes bounce{
    from{transform:translateY(0);}
    to{transform:translateY(-15px);}
}

.loading{
    font-size:50px;   /* เพิ่มขนาดตัวอักษร */
    font-weight:bold;
    color:white;
    letter-spacing:2px;
}

.display{
    font-size:28px;
    letter-spacing:10px;
    margin-top:10px;
}

.keypad{
    display:grid;
    grid-template-columns: repeat(3,80px);
    gap:15px;
    margin-top:20px;
}

/* iPhone Style Button */
.keypad button{
    height:70px;
    border:none;
    border-radius:20px;
    font-size:22px;
    color:white;
    background: linear-gradient(145deg,#ff4d6d,#ff1e4d);
    box-shadow: 0 8px 15px rgba(0,0,0,0.2),
                inset 0 2px 5px rgba(255,255,255,0.4);
    backdrop-filter: blur(10px);
    cursor:pointer;
    transition: all 0.15s ease;
}

.keypad button:active{
    transform: scale(0.92);
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
}

img{
    margin-top:20px;
    max-width:250px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

.shake{
    animation: shake 0.4s;
}

@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    50%{transform:translateX(5px);}
    75%{transform:translateX(-5px);}
    100%{transform:translateX(0);}
}

/* Floating Hearts */
.floating-heart{
    position:absolute;
    font-size:25px;
    animation: floatUp 3s linear forwards;
}

@keyframes floatUp{
    0%{transform:translateY(0); opacity:1;}
    100%{transform:translateY(-300px); opacity:0;}
}
</style>
</head>

<body>

<!-- เพลง -->
<audio id="bgMusic" src="love.mp3"></audio>

<!-- PAGE 1 -->
<div class="page active" id="page1" onclick="goLoading()">
    <h1>Happy Valentine's Day 🤍</h1>
    <div class="heart-big">💖</div>
    <div style="margin-top:20px;">แตะไปเพื่อไปต่อ</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <div class="loading">Loading..... 💕</div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
    <h1>ใส่รหัสผ่าน 💌</h1>
    <p>คำใบ้: วันเกิดและเดือน</p>
    <div class="display" id="display">____</div>

    <div class="keypad">
        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
        <button onclick="clearPass()">⌫</button>
        <button onclick="press(0)">0</button>
        <button onclick="checkPassword()">✓</button>
    </div>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
    <h1>Happy Valentine’s Day นะที่รัก 🤍</h1>
    <p>
        ขอบคุณที่เข้ามาเติมเต็มชีวิตกันทุกวัน <br>
        แค่มีหนูอยู่ข้าง ๆ ก็ดูสดใสขึ้นทันที <br>
        รักหนูไม่รู้จะอธิบายได้ยังเลย 💕
    </p>
    <img src="yourphoto.jpg" alt="รูปของเรา">
</div>

<script>
let passwordInput = "";

function goLoading(){
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");

    setTimeout(()=>{
        document.getElementById("page2").classList.remove("active");
        document.getElementById("page3").classList.add("active");
    },1000);
}

function press(num){
    if(passwordInput.length < 4){
        passwordInput += num;
        updateDisplay();
    }
}

function clearPass(){
    passwordInput="";
    updateDisplay();
}

function updateDisplay(){
    document.getElementById("display").innerText =
        passwordInput.padEnd(4,"_");
}

function checkPassword(){
    if(passwordInput === "1104"){
        document.getElementById("page3").classList.remove("active");
        document.getElementById("page4").classList.add("active");
        document.getElementById("bgMusic").play();
        floatingHearts();
    }else{
        document.getElementById("page3").classList.add("shake");
        setTimeout(()=>{
            document.getElementById("page3").classList.remove("shake");
        },400);
        passwordInput="";
        updateDisplay();
    }
}

function floatingHearts(){
    for(let i=0;i<25;i++){
        let heart=document.createElement("div");
        heart.className="floating-heart";
        heart.innerHTML="💖";
        heart.style.left=Math.random()*window.innerWidth+"px";
        heart.style.bottom="0px";
        heart.style.animationDuration=(Math.random()*2+2)+"s";
        document.body.appendChild(heart);

        setTimeout(()=>{heart.remove();},3000);
    }
}
</script>

</body>
</html>
